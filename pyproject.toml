[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mastertrd"
version = "0.1.0"
description = "Autonomous quantitative research and controlled trading platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
storage = [
  "duckdb>=1.3,<2",
  "pyarrow>=20,<22",
  "pandas>=2.2,<3",
]
research = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "optuna>=4.4,<5",
  "pymoo>=0.6.1,<0.7",
  "statsmodels>=0.14,<0.15",
  "arch>=7,<8",
  "ruptures>=1.1,<2",
  "river>=0.22,<0.23",
  "quantstats>=0.0.77,<0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mastertrd"]
branch = true
