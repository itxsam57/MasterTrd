[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mastertrd"
version = "0.1.0"
description = "Autonomous quantitative research and controlled trading platform"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
]
storage = [
  "duckdb>=1.3,<2",
  "pyarrow>=20,<23",
  "pandas>=2.2,<3",
]
research = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "plotly>=5.22,<7",
  "vectorbt>=0.28,<0.29",
  "optuna>=4.4,<5",
  "pymoo>=0.6.1,<0.7",
  "statsmodels>=0.14,<0.15",
  "arch>=7,<9",
  "ruptures>=1.1,<2",
  "river>=0.22,<0.24",
  "skfolio @ git+https://github.com/skfolio/skfolio.git@69bb9cbdd1f34628ddb9bdad077e6b1336f3b8e3",
  "quantstats>=0.0.77,<0.1",
]
execution = [
  "nautilus_trader>=1.220,<3",
]
hft = [
  "hftbacktest>=2,<3",
]
data-fallback = [
  "ccxt>=4,<5",
]
indicators = [
  "TA-Lib>=0.6,<0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mastertrd"]
branch = true
