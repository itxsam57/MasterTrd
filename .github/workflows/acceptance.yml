name: Completion Acceptance

on:
  push:
    paths:
      - 'MASTER_PLAN.md'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/ACCEPTANCE_REPORT.md'
      - '.github/workflows/acceptance.yml'
      - '.github/workflows/security.yml'
      - 'docs/superpowers/plans/**'
  pull_request:
    paths:
      - 'MASTER_PLAN.md'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/ACCEPTANCE_REPORT.md'
      - '.github/workflows/acceptance.yml'
      - '.github/workflows/security.yml'
      - 'docs/superpowers/plans/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  MASTERTRD_ACCEPTANCE_TESTNET_SMOKE: BLOCKED_OWNER_INPUT
  MASTERTRD_PROMOTION_GOVERNOR_ALLOWED: 'false'

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Verify locked full stack
        run: |
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
          echo 'MASTERTRD_ACCEPTANCE_LOCKED_INSTALL=PASS' >> "$GITHUB_ENV"
      - name: Run cumulative tests
        run: |
          uv run pytest -q
          echo 'MASTERTRD_ACCEPTANCE_CUMULATIVE_TESTS_AND_COVERAGE=PASS' >> "$GITHUB_ENV"
      - name: Verify V2 mandatory capability evidence
        run: |
          uv run pytest -q \
            tests/test_strategy_families.py \
            tests/test_execution_signals.py \
            tests/test_execution_signal_parity.py \
            tests/test_multileg_execution_policy.py \
            tests/test_options_execution_policy.py \
            tests/test_hft_execution_policy.py \
            tests/test_risk_state.py \
            tests/test_risk_runtime.py \
            tests/test_live_node.py \
            tests/test_runtime_shutdown.py \
            tests/test_paper_forward.py \
            tests/test_research_brain_specialist_wiring.py \
            tests/test_specialist_orchestrator.py \
            tests/test_testnet_workflow_candidate_bundle.py \
            tests/test_oracle_deployment.py \
            tests/test_operations_docs.py \
            tests/integration/test_research_all_families.py \
            tests/integration/test_generated_strategy_execution_contract.py \
            tests/integration/test_nautilus_family_compilers.py \
            tests/integration/test_hft_nautilus_execution.py \
            tests/integration/test_hft_real_l2.py \
            tests/integration/test_risk_execution_hook.py \
            tests/integration/test_runtime_factory.py \
            tests/integration/test_runtime_recovery.py \
            tests/integration/test_forward_paper_lifecycle.py \
            tests/integration/test_candidate_testnet_runner.py
          echo 'MASTERTRD_CAPABILITY_FAMILY_COVERAGE=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_EXECUTABLE_STRATEGY_SEMANTICS=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_MULTILEG_OPTIONS_EXECUTION=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_HFT_EXECUTION=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_RISK_STATE_OWNERSHIP=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_PERSISTENT_RUNTIME=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_FORWARD_PAPER_LIFECYCLE=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_SPECIALIST_RESEARCH_BRAIN=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_CANDIDATE_BOUND_TESTNET_INTERFACE=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_DEPLOYMENT_ARTIFACTS=PASS' >> "$GITHUB_ENV"
      - name: Verify risk reconciliation and kill evidence
        run: |
          uv run pytest -q \
            tests/test_live_evidence.py \
            tests/test_live_readiness.py \
            tests/test_risk_runtime.py \
            tests/test_reconciliation.py \
            tests/integration/test_risk_execution_hook.py \
            tests/integration/test_reconciliation_evidence.py \
            tests/integration/test_kill_switch_evidence.py
          echo 'MASTERTRD_ACCEPTANCE_RISK_REVIEW=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_ACCEPTANCE_RECONCILIATION_TEST=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_ACCEPTANCE_KILL_SWITCH_TEST=PASS' >> "$GITHUB_ENV"
      - name: Public repo safety proof
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pip install --disable-pip-version-check pip-audit detect-secrets
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.venv)(/|$)' > artifacts/detect-secrets.json
          set +e
          git grep -nEi -e "(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key[[:space:]]*=[[:space:]]*[\"'][^\"']{8,}[\"']|api[_-]?secret[[:space:]]*=[[:space:]]*[\"'][^\"']{16,}[\"']|seed phrase[[:space:]]*=[[:space:]]*[\"'][^\"']+[\"'])" -- 'src/**' ':!*.example' ':!MASTER_PLAN.md'
          grep_status=$?
          set -e
          if [ "$grep_status" -eq 0 ]; then
            echo 'Potential committed credential material detected'
            exit 1
          fi
          if [ "$grep_status" -ne 1 ]; then
            echo "Credential grep failed with status $grep_status"
            exit "$grep_status"
          fi
          python -m pip install -e '.[dev]'
          pip-audit --skip-editable
          echo 'MASTERTRD_ACCEPTANCE_PUBLIC_REPO_SAFETY=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_SECURITY=PASS' >> "$GITHUB_ENV"
      - name: Verify clean exact-SHA checkout
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'MASTERTRD_ACCEPTANCE_CLEAN_CHECKOUT=PASS' >> "$GITHUB_ENV"
          echo 'MASTERTRD_CAPABILITY_REPRODUCIBILITY=PASS' >> "$GITHUB_ENV"
      - name: Write exact-head full JSON acceptance artifact
        if: always()
        run: |
          mkdir -p artifacts
          uv run python -m mastertrd.acceptance . --full-report --write artifacts/acceptance.json
      - name: Write exact-head acceptance markdown
        if: always()
        run: |
          mkdir -p artifacts
          uv run python -m mastertrd.acceptance . --full-report --write artifacts/ACCEPTANCE_REPORT.md
      - name: Write exact-head commit identity
        if: always()
        run: |
          mkdir -p artifacts
          printf '%s\n' "${GITHUB_SHA}" > artifacts/commit-sha.txt
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastertrd-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14