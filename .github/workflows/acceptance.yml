name: Completion Acceptance

on:
  push:
    paths:
      - 'MASTER_PLAN.md'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/acceptance.yml'
      - 'docs/superpowers/plans/**'
  pull_request:
    paths:
      - 'MASTER_PLAN.md'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/acceptance.yml'
      - 'docs/superpowers/plans/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Verify locked full stack
        run: |
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Run cumulative tests
        run: uv run pytest -q
      - name: Write exact-head acceptance artifact
        if: always()
        run: |
          mkdir -p artifacts
          uv run python -m mastertrd.acceptance . --write artifacts/acceptance.json || true
          printf '%s\n' "${GITHUB_SHA}" > artifacts/commit-sha.txt
      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastertrd-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
