name: Clean superseded PAPER helper

on:
  push:
    branches: [v2/plan-closure-20260831]
    paths:
      - '.github/workflows/apply-paper-trade-size.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 0
      - name: Remove superseded one-shot workflow
        run: |
          git config user.name 'mastertrd-autopilot'
          git config user.email 'mastertrd-autopilot@users.noreply.github.com'
          rm .github/workflows/apply-paper-trade-size.yml
          git add .github/workflows/apply-paper-trade-size.yml
          git commit -m 'chore: remove superseded paper helper'
          git pull --rebase origin v2/plan-closure-20260831
          git push origin HEAD:v2/plan-closure-20260831
