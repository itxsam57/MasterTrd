name: Apply specialist robustness forwarding

on:
  push:
    branches:
      - v2/plan-closure-20260831
    paths:
      - .github/workflows/apply-specialist-robustness-forwarding.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded evidence forwarding
        run: |
          git pull --ff-only origin v2/plan-closure-20260831
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mastertrd/research_brain.py')
          text = path.read_text()
          marker = '                    starting_balances=config.starting_balances,\n                )\n                if not robust.promotion.allowed:'
          replacement = (
              '                    starting_balances=config.starting_balances,\n'
              '                    specialist_evidence=tuple(\n'
              '                        ValidationEvidence(**record)\n'
              '                        for record in item.get("evidence", ())\n'
              '                    ),\n'
              '                )\n'
              '                if not robust.promotion.allowed:'
          )
          if 'specialist_evidence=tuple(' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('robustness forwarding marker is ambiguous; refusing write')
              text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Verify focused GREEN
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv sync --locked --all-extras
          uv run pytest -q \
            tests/test_research_brain_specialist_robustness.py \
            tests/test_research_brain_specialist_stage.py \
            tests/test_research_brain_specialist_batch.py \
            tests/test_research_brain_specialist_wiring.py
      - name: Commit real code and remove one-shot workflow
        run: |
          rm .github/workflows/apply-specialist-robustness-forwarding.yml
          git config user.name 'itxsam57'
          git config user.email '143406136+itxsam57@users.noreply.github.com'
          git add src/mastertrd/research_brain.py .github/workflows/apply-specialist-robustness-forwarding.yml
          git commit -m 'feat(research): forward specialist evidence into robustness'
          git push origin HEAD:v2/plan-closure-20260831
