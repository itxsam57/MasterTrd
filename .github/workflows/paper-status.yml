name: PAPER Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paper-status.yml'
      - 'src/mastertrd/oracle_paper_status.py'
      - 'src/mastertrd/paper_status.py'
      - 'src/mastertrd/paper_diagnostics.py'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: paper-status-oracle
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: oracle
    env:
      ORACLE_ENABLED: ${{ vars.ORACLE_ENABLED }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed unless Oracle status access is explicitly enabled
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          if [[ "${ORACLE_ENABLED,,}" != "true" ]]; then
            echo 'Oracle status access is disabled.' >&2
            exit 1
          fi
          for name in ORACLE_HOST ORACLE_SSH_USER ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Oracle Environment secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure pinned SSH trust
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/oracle_key"
          chmod 600 "$HOME/.ssh/oracle_key"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read sanitized multi-strategy PAPER status without mutating Oracle
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p artifacts/paper-status/diagnostics
          target="${ORACLE_SSH_USER}@${ORACLE_HOST}"
          ssh_cmd=(ssh -i "$HOME/.ssh/oracle_key" -o BatchMode=yes)
          remote_sha="$("${ssh_cmd[@]}" "$target" "sudo -u mastertrd git -C /opt/mastertrd rev-parse HEAD")"
          paper_root="/var/lib/mastertrd/paper/$remote_sha"
          paper_root_q="$(printf '%q' "$paper_root")"
          "${ssh_cmd[@]}" "$target" \
            "sudo -u mastertrd /opt/mastertrd/.venv/bin/python -m mastertrd.oracle_paper_status --paper-root ${paper_root_q}" \
            > artifacts/paper-status/paper-status.json

          export PAPER_STATUS_PATH="artifacts/paper-status/paper-status.json"
          export PAPER_STATUS_REMOTE_SHA="$remote_sha"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PAPER_STATUS_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("code_hash") != os.environ["PAPER_STATUS_REMOTE_SHA"]:
              raise SystemExit("PAPER status code identity mismatch")
          instances = []
          for row in payload.get("strategies", []):
              instance = row.get("instance")
              if not isinstance(instance, str) or not instance.startswith("g-"):
                  raise SystemExit("PAPER status instance identity is invalid")
              instances.append(instance)
          if len(instances) != payload.get("strategy_count"):
              raise SystemExit("PAPER status strategy count mismatch")
          Path("artifacts/paper-status/instances.txt").write_text("\n".join(instances) + "\n", encoding="utf-8")
          PY

          : > artifacts/paper-status/services.tsv
          while IFS= read -r instance; do
            [[ "$instance" =~ ^g-[0-9a-f]{16}$ ]] || { echo "Invalid PAPER instance: $instance" >&2; exit 1; }
            state="$("${ssh_cmd[@]}" "$target" "bash -s -- '$instance' '$remote_sha'" <<'REMOTE_STATUS'
          set -euo pipefail
          instance="$1"
          expected_sha="$2"
          env_file="/etc/mastertrd/paper/$instance.env"
          sudo test -r "$env_file" || { echo "Missing PAPER env: $env_file" >&2; exit 1; }
          mode="$(sudo awk -F= '$1=="MASTERTRD_MODE" {print $2}' "$env_file" | tail -n1)"
          live="$(sudo awk -F= '$1=="LIVE_TRADING_ENABLED" {print $2}' "$env_file" | tail -n1)"
          code_hash="$(sudo awk -F= '$1=="MASTERTRD_CODE_HASH" {print $2}' "$env_file" | tail -n1)"
          [[ "${mode^^}" == "PAPER" ]] || { echo "Unsafe PAPER mode for $instance" >&2; exit 1; }
          [[ "${live,,}" == "false" ]] || { echo "LIVE_TRADING_ENABLED is not false for $instance" >&2; exit 1; }
          [[ "$code_hash" == "$expected_sha" ]] || { echo "Code identity mismatch for $instance" >&2; exit 1; }
          service="mastertrd-paper@$instance.service"
          active="$(systemctl is-active "$service" 2>/dev/null || true)"
          restarts="$(systemctl show "$service" --property=NRestarts --value 2>/dev/null || echo 0)"
          result="$(systemctl show "$service" --property=Result --value 2>/dev/null || true)"
          main_code="$(systemctl show "$service" --property=ExecMainCode --value 2>/dev/null || true)"
          main_status="$(systemctl show "$service" --property=ExecMainStatus --value 2>/dev/null || true)"
          if /usr/local/bin/mastertrd-health "$service" >/dev/null 2>&1; then health=true; else health=false; fi
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$instance" "$active" "$restarts" "$result" "$main_code" "$main_status" "$health"
          REMOTE_STATUS
          )"
            printf '%s\n' "$state" >> artifacts/paper-status/services.tsv
            service="mastertrd-paper@$instance.service"
            "${ssh_cmd[@]}" "$target" "sudo journalctl -u '$service' --no-pager -n 500 -o cat" \
              | python src/mastertrd/paper_diagnostics.py \
              > "artifacts/paper-status/diagnostics/$instance.json"
          done < artifacts/paper-status/instances.txt

          export PAPER_STATUS_SERVICES="artifacts/paper-status/services.tsv"
          export PAPER_STATUS_DIAGNOSTICS_DIR="artifacts/paper-status/diagnostics"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["PAPER_STATUS_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          services = {}
          for line in Path(os.environ["PAPER_STATUS_SERVICES"]).read_text(encoding="utf-8").splitlines():
              instance, active, restarts, result, main_code, main_status, health = line.split("\t")
              services[instance] = {
                  "service_active": active == "active",
                  "service_restarts": int(restarts or "0"),
                  "service_result": result or None,
                  "service_exec_main_code": main_code or None,
                  "service_exec_main_status": int(main_status) if main_status.isdigit() else None,
                  "health_ok": health == "true",
              }
          diagnostics_root = Path(os.environ["PAPER_STATUS_DIAGNOSTICS_DIR"])
          for row in payload["strategies"]:
              instance = row["instance"]
              if instance not in services:
                  raise SystemExit(f"Missing PAPER service status for {instance}")
              row.update(services[instance])
              diagnostic_path = diagnostics_root / f"{instance}.json"
              row["crash_diagnostics"] = json.loads(diagnostic_path.read_text(encoding="utf-8"))
          payload["remote_git_sha"] = os.environ["PAPER_STATUS_REMOTE_SHA"]
          payload["all_services_active"] = all(row["service_active"] for row in payload["strategies"])
          payload["all_health_ok"] = all(row["health_ok"] for row in payload["strategies"])
          path.write_text(json.dumps(payload, sort_keys=True, indent=2), encoding="utf-8")
          PY

          rm -f artifacts/paper-status/instances.txt artifacts/paper-status/services.tsv
          rm -rf artifacts/paper-status/diagnostics

      - name: Upload sanitized PAPER status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/paper-status/paper-status.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove local SSH key material
        if: always()
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          rm -f "$HOME/.ssh/oracle_key" "$HOME/.ssh/known_hosts"
