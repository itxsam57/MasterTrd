name: Apply capability acceptance fix

on:
  push:
    branches: [v2/plan-closure-20260831]
    paths:
      - '.github/workflows/apply-capability-acceptance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded capability acceptance fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mastertrd/acceptance.py')
          text = path.read_text(encoding='utf-8')

          old = '''    static_passed = all(check.passed for check in static_checks)\n    implementation_complete = (\n        static_passed\n        and not missing_mandatory_suites\n        and not failed_mandatory_suites\n    )\n'''
          new = '''    dataset_fixture_records = tuple(str(item) for item in dataset_fixtures)\n    engine_version_records = tuple(\n        sorted((str(name), str(version)) for name, version in engine_versions.items())\n    )\n    capability_evidence_present = (\n        bool(dataset_fixture_records)\n        and any(\n            name == "nautilus-trader" and bool(version.strip())\n            for name, version in engine_version_records\n        )\n    )\n    static_passed = all(check.passed for check in static_checks)\n    implementation_complete = (\n        static_passed\n        and not missing_mandatory_suites\n        and not failed_mandatory_suites\n        and capability_evidence_present\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit('acceptance implementation anchor drifted')
          text = text.replace(old, new, 1)

          old_return = '''        dataset_fixtures=tuple(str(item) for item in dataset_fixtures),\n        engine_versions=tuple(\n            sorted((str(name), str(version)) for name, version in engine_versions.items())\n        ),\n'''
          new_return = '''        dataset_fixtures=dataset_fixture_records,\n        engine_versions=engine_version_records,\n'''
          if text.count(old_return) != 1:
              raise SystemExit('acceptance report anchor drifted')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused GREEN
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.8'
          uv sync --locked --all-extras
          uv run pytest -q tests/test_capability_acceptance_red.py tests/test_acceptance.py tests/test_acceptance_report.py
      - name: Commit real code and remove one-shot workflow
        run: |
          git config user.name 'mastertrd-autopilot'
          git config user.email 'mastertrd-autopilot@users.noreply.github.com'
          rm .github/workflows/apply-capability-acceptance.yml
          git add src/mastertrd/acceptance.py .github/workflows/apply-capability-acceptance.yml
          git commit -m 'fix(acceptance): require capability evidence for process readiness'
          git push origin HEAD:v2/plan-closure-20260831
