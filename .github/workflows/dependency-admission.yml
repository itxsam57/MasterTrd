name: Dependency Admission

on:
  push:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-admission.yml'
      - 'src/mastertrd/dependencies.py'
  pull_request:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-admission.yml'
      - 'src/mastertrd/dependencies.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: nautilus, install: 'nautilus_trader>=1.220,<3', module: nautilus_trader}
          - {name: vectorbt, install: 'vectorbt>=0.28,<0.29 plotly>=5.22,<7', module: vectorbt}
          - {name: optuna, install: 'optuna>=4.4,<5', module: optuna}
          - {name: pymoo, install: 'pymoo>=0.6.1,<0.7', module: pymoo}
          - {name: duckdb, install: 'duckdb>=1.3,<2', module: duckdb}
          - {name: pyarrow, install: 'pyarrow>=20,<23', module: pyarrow}
          - {name: statsmodels, install: 'statsmodels>=0.14,<0.15', module: statsmodels}
          - {name: arch, install: 'arch>=7,<9', module: arch}
          - {name: ruptures, install: 'ruptures>=1.1,<2', module: ruptures}
          - {name: river, install: 'river>=0.22,<0.24', module: river}
          - {name: skfolio, install: 'git+https://github.com/skfolio/skfolio.git@69bb9cbdd1f34628ddb9bdad077e6b1336f3b8e3', module: skfolio}
          - {name: quantstats, install: 'quantstats>=0.0.77,<0.1', module: quantstats}
          - {name: hftbacktest, install: 'hftbacktest>=2,<3', module: hftbacktest}
          - {name: talib, install: 'TA-Lib>=0.6,<0.7', module: talib}
          - {name: ccxt, install: 'ccxt>=4,<5', module: ccxt}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install candidate
        env:
          INSTALL: ${{ matrix.install }}
        run: |
          python - <<'PY'
          import os, shlex, subprocess, sys
          specs = shlex.split(os.environ['INSTALL'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *specs])
          PY
      - name: Import and report version
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import importlib, importlib.metadata as md, os
          module = importlib.import_module(os.environ['MODULE'])
          print('imported:', module.__name__)
          try:
              print('distribution-version:', md.version(os.environ['MODULE'].replace('_', '-')))
          except md.PackageNotFoundError:
              print('distribution-version: available via import; package name differs')
          PY
