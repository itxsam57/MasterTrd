name: Dependency Admission

on:
  push:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-admission.yml'
      - 'src/mastertrd/dependencies.py'
  pull_request:
    paths:
      - 'pyproject.toml'
      - '.github/workflows/dependency-admission.yml'
      - 'src/mastertrd/dependencies.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: nautilus, package: 'nautilus_trader>=1.220,<3', module: nautilus_trader}
          - {name: vectorbt, package: 'vectorbt>=0.28,<0.29', module: vectorbt}
          - {name: optuna, package: 'optuna>=4.4,<5', module: optuna}
          - {name: pymoo, package: 'pymoo>=0.6.1,<0.7', module: pymoo}
          - {name: duckdb, package: 'duckdb>=1.3,<2', module: duckdb}
          - {name: pyarrow, package: 'pyarrow>=20,<23', module: pyarrow}
          - {name: statsmodels, package: 'statsmodels>=0.14,<0.15', module: statsmodels}
          - {name: arch, package: 'arch>=7,<9', module: arch}
          - {name: ruptures, package: 'ruptures>=1.1,<2', module: ruptures}
          - {name: river, package: 'river>=0.22,<0.24', module: river}
          - {name: skfolio, package: 'skfolio>=0.10,<0.12', module: skfolio}
          - {name: quantstats, package: 'quantstats>=0.0.77,<0.1', module: quantstats}
          - {name: hftbacktest, package: 'hftbacktest>=2,<3', module: hftbacktest}
          - {name: talib, package: 'TA-Lib>=0.6,<0.7', module: talib}
          - {name: ccxt, package: 'ccxt>=4,<5', module: ccxt}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install candidate
        run: pip install "${{ matrix.package }}"
      - name: Import and report version
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python - <<'PY'
          import importlib, importlib.metadata as md, os
          module = importlib.import_module(os.environ['MODULE'])
          print('imported:', module.__name__)
          try:
              print('distribution-version:', md.version(os.environ['MODULE'].replace('_', '-')))
          except md.PackageNotFoundError:
              print('distribution-version: available via import; package name differs')
          PY
