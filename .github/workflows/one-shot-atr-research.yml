name: One-shot ATR Research

on:
  push:
    branches:
      - ops/research-atr-af3cfbd-20260903
    paths:
      - .github/workflows/one-shot-atr-research.yml

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af3cfbd8a96a91fea4eca821e781fd521d34531e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact locked stack
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
          test "$(git rev-parse HEAD)" = 'af3cfbd8a96a91fea4eca821e781fd521d34531e'
      - name: Run exact-SHA ATR breakout slow ResearchBrain shard
        run: |
          env -u GITHUB_SHA \
            MASTERTRD_CODE_HASH=af3cfbd8a96a91fea4eca821e781fd521d34531e \
            MASTERTRD_RESEARCH_RECIPE_ID=atr-breakout-slow \
            PYTHONUNBUFFERED=1 \
            uv run python -m mastertrd.research_job
      - name: Verify report identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/research/research-report.json').read_text())
          if p.get('code_hash') != 'af3cfbd8a96a91fea4eca821e781fd521d34531e':
              raise SystemExit('research report code hash mismatch')
          runs = p.get('runs', [])
          if not runs or any(r.get('recipe_id') != 'atr-breakout-slow' for r in runs):
              raise SystemExit('research report recipe mismatch')
          print(json.dumps({'code_hash': p['code_hash'], 'runs': len(runs), 'paper_candidates': sum(len(r.get('paper_candidates', [])) for r in runs)}, sort_keys=True))
          PY
      - name: Upload exact-SHA ATR research report
        uses: actions/upload-artifact@v4
        with:
          name: atr-research-af3cfbd
          path: artifacts/research/research-report.json
          if-no-files-found: error
          retention-days: 7
