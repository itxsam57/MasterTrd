name: Oracle Deploy

on:
  workflow_dispatch:
    inputs:
      paper_candidate_manifest_json:
        description: Public-safe ResearchJob PAPER candidate manifest for this exact source SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oracle
    env:
      ORACLE_ENABLED: ${{ vars.ORACLE_ENABLED }}
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fail closed unless Oracle deployment is explicitly enabled
        shell: bash
        run: |
          if [[ "${ORACLE_ENABLED,,}" != "true" ]]; then
            echo 'Oracle deployment is disabled. Set Environment variable ORACLE_ENABLED=true explicitly.' >&2
            exit 1
          fi
          for name in ORACLE_HOST ORACLE_SSH_USER ORACLE_SSH_KEY ORACLE_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Oracle Environment secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Verify exact locked source before rendering deployment
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate identity-bound PAPER candidate
        env:
          PAPER_CANDIDATE_MANIFEST_JSON: ${{ inputs.paper_candidate_manifest_json }}
        run: |
          mkdir -p artifacts/oracle
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from mastertrd.oracle import validate_paper_candidate_manifest

          try:
              payload = json.loads(os.environ["PAPER_CANDIDATE_MANIFEST_JSON"])
          except (KeyError, json.JSONDecodeError) as exc:
              raise SystemExit("paper_candidate_manifest_json must contain valid JSON") from exc
          if not isinstance(payload, dict):
              raise SystemExit("paper_candidate_manifest_json must contain a JSON object")

          lock_hash = hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest()
          candidate = validate_paper_candidate_manifest(
              payload,
              expected_code_hash=os.environ["GITHUB_SHA"],
              expected_lock_hash=lock_hash,
          )
          candidate_path = Path("artifacts/oracle/paper-candidate.json")
          candidate_path.write_text(
              json.dumps(candidate.canonical_payload(), sort_keys=True, indent=2, allow_nan=False),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"PAPER_GENOME_HASH={candidate.genome_hash}\n")
          print(
              json.dumps(
                  {
                      "paper_candidate": str(candidate_path),
                      "strategy_id": candidate.strategy_id,
                      "genome_hash": candidate.genome_hash,
                      "code_hash": os.environ["GITHUB_SHA"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Render deployment bundle
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from mastertrd.oracle import OracleDeploymentSpec, render_oracle_bundle

          spec = OracleDeploymentSpec(
              app_dir='/opt/mastertrd',
              service_user='mastertrd',
              python_bin='/opt/mastertrd/.venv/bin/python',
              module='mastertrd.live_node',
              env_file='/etc/mastertrd/mastertrd.env',
          )
          bundle = render_oracle_bundle(spec)
          root = Path('artifacts/oracle')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'bootstrap.sh').write_text(bundle.bootstrap_script, encoding='utf-8')
          (root / 'mastertrd.service').write_text(bundle.systemd_unit, encoding='utf-8')
          (root / 'mastertrd.logrotate').write_text(bundle.logrotate_config, encoding='utf-8')
          (root / 'mastertrd-health').write_text(bundle.health_script, encoding='utf-8')
          PY
          chmod 700 artifacts/oracle/bootstrap.sh

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/oracle_key"
          chmod 600 "$HOME/.ssh/oracle_key"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact SHA and identity-checked PAPER candidate
        shell: bash
        run: |
          target="${ORACLE_SSH_USER}@${ORACLE_HOST}"
          remote_bootstrap="/tmp/mastertrd-bootstrap-${GITHUB_SHA}.sh"
          remote_candidate="/tmp/mastertrd-paper-candidate-${GITHUB_SHA}.json"
          scp -i "$HOME/.ssh/oracle_key" -o BatchMode=yes artifacts/oracle/bootstrap.sh "${target}:${remote_bootstrap}"
          scp -i "$HOME/.ssh/oracle_key" -o BatchMode=yes artifacts/oracle/paper-candidate.json "${target}:${remote_candidate}"
          ssh -i "$HOME/.ssh/oracle_key" -o BatchMode=yes "$target" \
            "GITHUB_SHA='$GITHUB_SHA' PAPER_GENOME_HASH='$PAPER_GENOME_HASH' REMOTE_BOOTSTRAP='$remote_bootstrap' REMOTE_CANDIDATE='$remote_candidate' bash -s" <<'REMOTE'
          set -euo pipefail

          cleanup() {
            rm -f "$REMOTE_BOOTSTRAP" "$REMOTE_CANDIDATE"
          }
          trap cleanup EXIT

          if sudo test -f /etc/mastertrd/mastertrd.env; then
            current_mode="$(sudo awk -F= '$1=="MASTERTRD_MODE" {print $2}' /etc/mastertrd/mastertrd.env | tail -n1)"
            current_live="$(sudo awk -F= '$1=="LIVE_TRADING_ENABLED" {print $2}' /etc/mastertrd/mastertrd.env | tail -n1)"
            if [[ "${current_mode^^}" == "LIVE" || "${current_live,,}" == "true" ]]; then
              echo 'Oracle host is configured for LIVE; refusing automated mutation or restart.' >&2
              exit 1
            fi
          fi

          sudo bash "$REMOTE_BOOTSTRAP"

          if [[ ! -d /opt/mastertrd/.git ]]; then
            sudo -u mastertrd git clone https://github.com/itxsam57/MasterTrd.git /opt/mastertrd
          fi

          if ! sudo -u mastertrd git -C /opt/mastertrd diff --quiet --ignore-submodules --; then
            echo 'Tracked changes exist on Oracle host; refusing destructive deployment.' >&2
            exit 1
          fi

          sudo -u mastertrd git -C /opt/mastertrd fetch --depth=1 origin "$GITHUB_SHA"
          sudo -u mastertrd git -C /opt/mastertrd checkout --detach "$GITHUB_SHA"

          if [[ ! -x /opt/mastertrd/.uv-tool/bin/uv ]]; then
            sudo -u mastertrd python3 -m venv /opt/mastertrd/.uv-tool
            sudo -u mastertrd /opt/mastertrd/.uv-tool/bin/python -m pip install --disable-pip-version-check 'uv==0.12.7'
          fi
          sudo -u mastertrd bash -c 'cd /opt/mastertrd && .uv-tool/bin/uv lock --check && .uv-tool/bin/uv sync --locked --all-extras && .uv-tool/bin/uv pip check'
          test "$(sudo -u mastertrd git -C /opt/mastertrd rev-parse HEAD)" = "$GITHUB_SHA"

          paper_root="/var/lib/mastertrd/paper/$GITHUB_SHA/$PAPER_GENOME_HASH"
          paper_candidate="$paper_root/paper-candidate.json"
          paper_session="$paper_root/paper-session.json"
          paper_archive="$paper_root/paper-reports.json"
          paper_history="$paper_root/paper-sessions"
          paper_rotation_request="$paper_root/paper-rotate.request"
          sudo install -d -o mastertrd -g mastertrd -m 700 "$paper_root" "$paper_history"
          sudo install -o mastertrd -g mastertrd -m 600 "$REMOTE_CANDIDATE" "$paper_candidate"

          set_env_value() {
            local key="$1"
            local value="$2"
            local env_file=/etc/mastertrd/mastertrd.env
            if sudo grep -q "^${key}=" "$env_file"; then
              sudo sed -i "s|^${key}=.*$|${key}=${value}|" "$env_file"
            else
              printf '%s=%s\n' "$key" "$value" | sudo tee -a "$env_file" >/dev/null
            fi
          }

          set_env_value MASTERTRD_MODE PAPER
          set_env_value LIVE_TRADING_ENABLED false
          set_env_value ORACLE_ENABLED true
          set_env_value MASTERTRD_CANDIDATE_MANIFEST "$paper_candidate"
          set_env_value MASTERTRD_SESSION_STATE "$paper_session"
          set_env_value MASTERTRD_PAPER_ARCHIVE "$paper_archive"
          set_env_value MASTERTRD_PAPER_HISTORY_DIR "$paper_history"
          set_env_value MASTERTRD_PAPER_ROTATION_REQUEST "$paper_rotation_request"
          set_env_value MASTERTRD_PAPER_ROTATE_AFTER_SECONDS 86400
          set_env_value MASTERTRD_CODE_HASH "$GITHUB_SHA"
          set_env_value MASTERTRD_PUBLIC_FEED_FIXTURE ''
          set_env_value MASTERTRD_SESSION_NONCE "$GITHUB_SHA:$PAPER_GENOME_HASH"
          set_env_value MASTERTRD_PAPER_START_NS ''
          sudo chown root:root /etc/mastertrd/mastertrd.env
          sudo chmod 600 /etc/mastertrd/mastertrd.env

          sudo grep -Eq '^MASTERTRD_MODE=PAPER$' /etc/mastertrd/mastertrd.env
          sudo grep -Eq '^LIVE_TRADING_ENABLED=false$' /etc/mastertrd/mastertrd.env
          sudo grep -Eq '^ORACLE_ENABLED=true$' /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_CANDIDATE_MANIFEST=$paper_candidate" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_SESSION_STATE=$paper_session" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_PAPER_ARCHIVE=$paper_archive" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_PAPER_HISTORY_DIR=$paper_history" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_PAPER_ROTATION_REQUEST=$paper_rotation_request" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx 'MASTERTRD_PAPER_ROTATE_AFTER_SECONDS=86400' /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_CODE_HASH=$GITHUB_SHA" /etc/mastertrd/mastertrd.env
          sudo grep -Fqx "MASTERTRD_SESSION_NONCE=$GITHUB_SHA:$PAPER_GENOME_HASH" /etc/mastertrd/mastertrd.env

          sudo systemctl restart mastertrd.service
          sudo /usr/local/bin/mastertrd-health
          REMOTE

      - name: Remove local SSH key material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/oracle_key" "$HOME/.ssh/known_hosts"