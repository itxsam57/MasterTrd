name: Research Stack

on:
  push:
    paths:
      - 'src/mastertrd/research/**'
      - 'src/mastertrd/research_brain.py'
      - 'src/mastertrd/research_candidate_generation.py'
      - 'src/mastertrd/research_job.py'
      - 'src/mastertrd/strategy_universe.py'
      - 'src/mastertrd/memory_duckdb.py'
      - 'tests/integration/**'
      - 'tests/test_research_job.py'
      - 'tests/test_research_recipe_scheduling.py'
      - 'tests/test_scheduled_recipe_research.py'
      - 'tests/test_strategy_recipe_compiler.py'
      - 'tests/test_strategy_universe.py'
      - 'tests/test_workflow_policy.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/autonomous-research.yml'
      - '.github/workflows/research-stack.yml'
  pull_request:
    paths:
      - 'src/mastertrd/research/**'
      - 'src/mastertrd/research_brain.py'
      - 'src/mastertrd/research_candidate_generation.py'
      - 'src/mastertrd/research_job.py'
      - 'src/mastertrd/strategy_universe.py'
      - 'src/mastertrd/memory_duckdb.py'
      - 'tests/integration/**'
      - 'tests/test_research_job.py'
      - 'tests/test_research_recipe_scheduling.py'
      - 'tests/test_scheduled_recipe_research.py'
      - 'tests/test_strategy_recipe_compiler.py'
      - 'tests/test_strategy_universe.py'
      - 'tests/test_workflow_policy.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/autonomous-research.yml'
      - '.github/workflows/research-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dedicated research gate owns the public-data job, ResearchBrain, and
  # Strategy Universe recipe/compiler/traceability surfaces. Full Stack remains
  # the cumulative safety net for the entire repository.
  integrated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked research stack
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Run research integration tests
        run: |
          uv run pytest -q \
            tests/test_research_job.py \
            tests/test_research_recipe_scheduling.py \
            tests/test_scheduled_recipe_research.py \
            tests/test_strategy_recipe_compiler.py \
            tests/test_strategy_universe.py \
            tests/test_workflow_policy.py \
            tests/integration/test_strategy_universe_research.py \
            tests/integration/test_research_stack.py \
            tests/integration/test_advanced_research.py \
            tests/integration/test_duckdb_memory.py \
            tests/integration/test_autonomous_research_cycle.py
