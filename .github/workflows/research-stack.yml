name: Research Stack

on:
  push:
    paths:
      - 'src/mastertrd/research/**'
      - 'src/mastertrd/memory_duckdb.py'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/research-stack.yml'
  pull_request:
    paths:
      - 'src/mastertrd/research/**'
      - 'src/mastertrd/memory_duckdb.py'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - '.github/workflows/research-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install combined research stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,storage,research]"
      - name: Run research integration tests
        run: |
          pytest -q \
            tests/integration/test_research_stack.py \
            tests/integration/test_advanced_research.py \
            tests/integration/test_duckdb_memory.py
