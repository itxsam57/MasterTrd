name: Autonomous Research

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked stack
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Run ResearchBrain on checksum-verified public Binance data
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timedelta, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen, urlretrieve

          from nautilus_trader.test_kit.providers import TestInstrumentProvider

          from mastertrd.data.archive import dataset_hash_for_bars, read_binance_archive
          from mastertrd.data.binance_public import binance_kline_url
          from mastertrd.memory_duckdb import DuckDbResearchMemory
          from mastertrd.research.generator import generate_candidate
          from mastertrd.research_brain import (
              ResearchBrainConfig,
              ResearchDataset,
              run_research_brain,
          )

          artifact_dir = Path('artifacts/research')
          data_dir = artifact_dir / 'public-data'
          data_dir.mkdir(parents=True, exist_ok=True)

          # Use the latest month which is guaranteed to be fully closed before
          # the previous month: this avoids partial monthly archives near month-end.
          first_this_month = datetime.now(timezone.utc).date().replace(day=1)
          last_previous_month = first_this_month - timedelta(days=1)
          stable_month_end = last_previous_month.replace(day=1) - timedelta(days=1)
          period = stable_month_end.strftime('%Y-%m')

          eth = TestInstrumentProvider.ethusdt_binance()
          btc = TestInstrumentProvider.btcusdt_binance()
          candidate = generate_candidate(
              family='trend',
              instruments=(eth.id.value,),
              seed=42,
          )
          timeframe = candidate.timeframe

          def verified_bars(symbol: str, instrument_id: str):
              url = binance_kline_url(
                  market='spot',
                  symbol=symbol,
                  interval=timeframe,
                  period=period,
              )
              archive_path = data_dir / url.rsplit('/', 1)[-1]
              checksum_url = f'{url}.CHECKSUM'
              checksum_text = urlopen(checksum_url, timeout=30).read().decode('utf-8').strip()
              expected_sha256 = checksum_text.split()[0]
              if len(expected_sha256) != 64:
                  raise RuntimeError(f'invalid Binance checksum response for {symbol}')
              urlretrieve(url, archive_path)
              result = read_binance_archive(
                  archive_path,
                  expected_sha256=expected_sha256,
                  symbol=instrument_id,
                  interval=timeframe,
              )
              return result.bars, result.manifest

          eth_bars, eth_manifest = verified_bars('ETHUSDT', eth.id.value)
          btc_bars, btc_manifest = verified_bars('BTCUSDT', btc.id.value)
          dataset_hash = dataset_hash_for_bars((*eth_bars, *btc_bars))

          dataset = ResearchDataset(
              dataset_hash=dataset_hash,
              bars_by_instrument={
                  eth.id.value: eth_bars,
                  btc.id.value: btc_bars,
              },
              nautilus_instruments={
                  eth.id.value: eth,
                  btc.id.value: btc,
              },
          )
          config = ResearchBrainConfig(
              families=('trend',),
              instruments=(eth.id.value,),
              seed_start=42,
              seed_stop=43,
              screening_min_return=-1.0,
              optimization_trials=2,
              evolution_generations=1,
              evolution_population=4,
              validation_budget=1,
              paper_queue_cap=1,
              hidden_fraction=0.20,
              trade_size='0.01000',
              starting_balances=('10 ETH', '10 BTC', '100000 USDT'),
          )

          lock_hash = hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest()
          code_hash = os.environ['GITHUB_SHA']
          memory = DuckDbResearchMemory(artifact_dir / 'research.duckdb')
          try:
              report = run_research_brain(
                  config,
                  dataset,
                  memory,
                  code_hash=code_hash,
                  lock_hash=lock_hash,
              )
          finally:
              memory.close()

          public_report = {
              'code_hash': code_hash,
              'lock_hash': lock_hash,
              'dataset_hash': dataset_hash,
              'source': 'binance-public-data',
              'period': period,
              'timeframe': timeframe,
              'manifests': [
                  {
                      'instrument': eth_manifest.instrument,
                      'row_count': eth_manifest.row_count,
                      'file_sha256': eth_manifest.file_sha256,
                  },
                  {
                      'instrument': btc_manifest.instrument,
                      'row_count': btc_manifest.row_count,
                      'file_sha256': btc_manifest.file_sha256,
                  },
              ],
              'run_id': report.run_id,
              'generated': report.generated,
              'stored': report.stored,
              'paper_queued': report.paper_queued,
              'resumed': report.resumed,
              'finalists': [
                  {
                      'strategy_id': item.strategy_id,
                      'genome_hash': item.genome_hash,
                      'state': item.state.value,
                      'score': item.score,
                      'reason': item.reason,
                  }
                  for item in report.finalists
              ],
          }
          (artifact_dir / 'research-report.json').write_text(
              json.dumps(public_report, sort_keys=True, indent=2),
              encoding='utf-8',
          )
          PY
      - name: Upload public-safe research report
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-${{ github.sha }}
          path: artifacts/research/research-report.json
          if-no-files-found: error
          retention-days: 14
