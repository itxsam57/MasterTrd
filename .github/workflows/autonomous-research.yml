name: Autonomous Research

on:
  push:
    branches:
      - main
    paths:
      - 'src/mastertrd/research_job.py'
      - 'src/mastertrd/research_brain.py'
      - 'src/mastertrd/strategy_universe.py'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked stack
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Run ResearchBrain on checksum-verified public Binance data
        env:
          PYTHONUNBUFFERED: '1'
        run: uv run python -m mastertrd.research_job
      - name: Upload public-safe research report
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-${{ github.sha }}
          path: artifacts/research/research-report.json
          if-no-files-found: error
          retention-days: 14
