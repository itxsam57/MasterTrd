name: Apply operator runtime docs

on:
  push:
    branches: [v2/plan-closure-20260831]
    paths:
      - '.github/workflows/apply-operator-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 0
      - name: Apply guarded runbook fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/OPERATIONS.md')
          text = path.read_text(encoding='utf-8')

          anchor = '''`python -m mastertrd.live_node` uses the repository-owned `build_execution_runtime` factory. PAPER needs no exchange execution credential; DEMO/TESTNET/LIVE still fail closed on their mode-specific credential and safety gates.\n\n## Linux production node\n'''
          replacement = '''`python -m mastertrd.live_node` uses the repository-owned `build_execution_runtime` factory. PAPER needs no exchange execution credential; DEMO/TESTNET/LIVE still fail closed on their mode-specific credential and safety gates.\n\n### Required persistent-runtime inputs\n\nThe mode flags alone are not enough to start the persistent execution process. Before invoking `python -m mastertrd.live_node`, provide an approved StrategyGenome JSON file through `MASTERTRD_CANDIDATE_MANIFEST`. The manifest is the exact candidate the runtime is allowed to execute; do not point this variable at a generic system-smoke or unrelated candidate.\n\nPAPER additionally requires:\n\n- `MASTERTRD_SESSION_STATE`: writable JSON state path used for crash-safe PAPER journaling/recovery.\n- `MASTERTRD_CODE_HASH`: exact source identity bound into the PAPER session.\n- optional `MASTERTRD_PUBLIC_FEED_FIXTURE`, `MASTERTRD_SESSION_NONCE`, and `MASTERTRD_PAPER_START_NS` for deterministic/offline replay.\n\nDEMO, TESTNET, and LIVE additionally require `MASTERTRD_BINANCE_PRODUCT` set explicitly to `SPOT`, `USD_M`, or `COIN_M`, plus that mode's `BINANCE_<MODE>_*` credentials. No mode silently selects a product or falls back to another credential namespace.\n\nThe checked-in `.env.example` lists these names but is not automatically loaded by Python; export them into the process environment or supply them through the service/GitHub Environment. Empty placeholders intentionally fail closed.\n\n## Linux production node\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime-input documentation anchor drifted')
          text = text.replace(anchor, replacement, 1)

          paper_old = '''MASTERTRD_MODE=PAPER\nLIVE_TRADING_ENABLED=false\n```\n\nPAPER never requires exchange execution credentials.'''
          paper_new = '''MASTERTRD_MODE=PAPER\nLIVE_TRADING_ENABLED=false\nMASTERTRD_CANDIDATE_MANIFEST=/absolute/path/to/approved-candidate.json\nMASTERTRD_SESSION_STATE=/var/lib/mastertrd/paper-session.json\nMASTERTRD_CODE_HASH=<exact-deployed-git-sha>\n```\n\nPAPER never requires exchange execution credentials.'''
          if text.count(paper_old) != 1:
              raise SystemExit('PAPER documentation anchor drifted')
          text = text.replace(paper_old, paper_new, 1)

          demo_old = '''MASTERTRD_MODE=DEMO\nLIVE_TRADING_ENABLED=false\n```\n\nPopulate only the `BINANCE_DEMO_*` credential set.'''
          demo_new = '''MASTERTRD_MODE=DEMO\nLIVE_TRADING_ENABLED=false\nMASTERTRD_CANDIDATE_MANIFEST=/absolute/path/to/approved-candidate.json\nMASTERTRD_BINANCE_PRODUCT=SPOT\n```\n\nPopulate only the `BINANCE_DEMO_*` credential set.'''
          if text.count(demo_old) != 1:
              raise SystemExit('DEMO documentation anchor drifted')
          text = text.replace(demo_old, demo_new, 1)

          testnet_old = '''MASTERTRD_MODE=TESTNET\nLIVE_TRADING_ENABLED=false\n```\n\nPopulate only `BINANCE_TESTNET_API_KEY`'''
          testnet_new = '''MASTERTRD_MODE=TESTNET\nLIVE_TRADING_ENABLED=false\nMASTERTRD_CANDIDATE_MANIFEST=/absolute/path/to/approved-candidate.json\nMASTERTRD_BINANCE_PRODUCT=SPOT\n```\n\nPopulate only `BINANCE_TESTNET_API_KEY`'''
          if text.count(testnet_old) != 1:
              raise SystemExit('TESTNET documentation anchor drifted')
          text = text.replace(testnet_old, testnet_new, 1)

          live_old = '''MASTERTRD_MODE=LIVE\nLIVE_TRADING_ENABLED=true\nORACLE_ENABLED=true\n```\n'''
          live_new = '''MASTERTRD_MODE=LIVE\nLIVE_TRADING_ENABLED=true\nORACLE_ENABLED=true\nMASTERTRD_CANDIDATE_MANIFEST=/absolute/path/to/governor-approved-live-candidate.json\nMASTERTRD_BINANCE_PRODUCT=SPOT\n```\n'''
          if text.count(live_old) != 1:
              raise SystemExit('LIVE documentation anchor drifted')
          text = text.replace(live_old, live_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify documented variables exist in runtime
        run: |
          grep -F 'MASTERTRD_CANDIDATE_MANIFEST' src/mastertrd/runtime_factory.py
          grep -F 'MASTERTRD_SESSION_STATE' src/mastertrd/runtime_factory.py
          grep -F 'MASTERTRD_CODE_HASH' src/mastertrd/runtime_factory.py
          grep -F 'MASTERTRD_BINANCE_PRODUCT' src/mastertrd/runtime_factory.py
          grep -F 'MASTERTRD_CANDIDATE_MANIFEST' docs/OPERATIONS.md
          grep -F 'MASTERTRD_BINANCE_PRODUCT' docs/OPERATIONS.md
      - name: Commit docs and remove one-shot workflow
        run: |
          git config user.name 'mastertrd-autopilot'
          git config user.email 'mastertrd-autopilot@users.noreply.github.com'
          rm .github/workflows/apply-operator-docs.yml
          git add docs/OPERATIONS.md .github/workflows/apply-operator-docs.yml
          git commit -m 'docs(ops): document required persistent runtime inputs'
          git push origin HEAD:v2/plan-closure-20260831
