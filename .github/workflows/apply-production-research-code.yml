name: Apply Production Research Code Patch

on:
  push:
    branches:
      - fix/production-research-policy-20260904
    paths:
      - '.github/workflows/apply-production-research-code.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-research-policy-20260904
          fetch-depth: 1
      - name: Apply exact source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mastertrd/research_job.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once('from datetime import date, datetime, timedelta, timezone\n', 'from datetime import date, datetime, timedelta, timezone\nfrom enum import Enum\n')
          replace_once('from .contracts import StrategyState\n', 'from .advanced_validation import AdvancedValidationPolicy\nfrom .asset_transfer import AssetTransferPolicy\nfrom .contracts import StrategyState\n')
          replace_once('from .genome import StrategyGenome\n', 'from .genome import StrategyGenome\nfrom .hidden_gate import HiddenGatePolicy\n')
          replace_once('from .research_brain import ResearchBrainConfig, ResearchDataset, run_research_brain\n', 'from .research_brain import ResearchBrainConfig, ResearchDataset, run_research_brain\nfrom .robustness import RobustnessPolicy\n')
          replace_once('\n\n@dataclass(frozen=True, slots=True)\nclass ResearchJobBlocker:', '\n\nclass ResearchProfile(str, Enum):\n    SMOKE = "smoke"\n    PRODUCTION = "production"\n\n\n@dataclass(frozen=True, slots=True)\nclass ResearchJobBlocker:')

          factory = '''\n\ndef research_brain_config_for_run(\n    *,\n    plan: ResearchJobPlan,\n    family: str,\n    seed: int,\n    recipe_id: str | None,\n    profile: ResearchProfile = ResearchProfile.SMOKE,\n) -> ResearchBrainConfig:\n    """Build one explicit research policy so smoke and candidate production cannot drift."""\n    common = dict(\n        families=(family,),\n        instruments=plan.instruments,\n        seed_start=seed,\n        seed_stop=seed + 1,\n        validation_budget=len(plan.instruments),\n        paper_queue_cap=1,\n        hidden_fraction=0.20,\n        validation_window=50,\n        trade_size="0.01000",\n        starting_balances=("10 ETH", "10 BTC", "100000 USDT"),\n        recipe_ids=(recipe_id,) if recipe_id is not None else (),\n    )\n    if profile is ResearchProfile.SMOKE:\n        return ResearchBrainConfig(\n            screening_min_return=-1.0,\n            optimization_trials=2,\n            evolution_generations=1,\n            evolution_population=4,\n            **common,\n        )\n    if profile is not ResearchProfile.PRODUCTION:\n        raise ValueError(f"unsupported research profile: {profile!r}")\n    return ResearchBrainConfig(\n        screening_min_return=0.0,\n        optimization_trials=24,\n        evolution_generations=8,\n        evolution_population=16,\n        fees=0.001,\n        slippage=0.0005,\n        stressed_fees=0.002,\n        stressed_slippage=0.001,\n        robustness_policy=RobustnessPolicy(\n            min_trades_per_slice=5,\n            min_profitable_slice_ratio=0.50,\n            max_drawdown=0.25,\n            min_stressed_return=0.0,\n            max_return_degradation=0.50,\n            min_stable_neighbor_ratio=0.50,\n        ),\n        advanced_policy=AdvancedValidationPolicy(\n            min_evaluations=1,\n            min_trades_per_evaluation=5,\n            min_positive_ratio=1.0,\n            max_drawdown=0.25,\n            min_monte_carlo_survival_ratio=1.0,\n            max_monte_carlo_loss=-0.10,\n        ),\n        asset_transfer_policy=AssetTransferPolicy(\n            min_transfer_assets=1,\n            min_trades_per_asset=5,\n            min_pass_ratio=1.0,\n            min_total_return=0.0,\n            max_drawdown=0.25,\n        ),\n        hidden_policy=HiddenGatePolicy(\n            min_trades_per_evaluation=5,\n            min_total_return=0.0,\n            max_drawdown=0.25,\n            min_regime_pass_ratio=0.67,\n        ),\n        **common,\n    )\n'''
          replace_once('\n\ndef _stable_archive_periods(', factory + '\n\ndef _stable_archive_periods(')
          replace_once('''def run_research_job(\n    plan: ResearchJobPlan,\n    *,\n    artifact_dir: Path,\n    code_hash: str,\n    lock_hash: str,\n) -> dict[str, object]:''', '''def run_research_job(\n    plan: ResearchJobPlan,\n    *,\n    artifact_dir: Path,\n    code_hash: str,\n    lock_hash: str,\n    profile: ResearchProfile = ResearchProfile.SMOKE,\n) -> dict[str, object]:''')
          replace_once('''                config = ResearchBrainConfig(\n                    families=(family,),\n                    instruments=plan.instruments,\n                    seed_start=seed,\n                    seed_stop=seed + 1,\n                    screening_min_return=-1.0,\n                    optimization_trials=2,\n                    evolution_generations=1,\n                    evolution_population=4,\n                    validation_budget=len(plan.instruments),\n                    paper_queue_cap=1,\n                    hidden_fraction=0.20,\n                    validation_window=50,\n                    trade_size="0.01000",\n                    starting_balances=("10 ETH", "10 BTC", "100000 USDT"),\n                    recipe_ids=(recipe_id,) if recipe_id is not None else (),\n                )''', '''                config = research_brain_config_for_run(\n                    plan=plan,\n                    family=family,\n                    seed=seed,\n                    recipe_id=recipe_id,\n                    profile=profile,\n                )''')
          replace_once('''    return {\n        "schema_version": 1,''', '''    return {\n        "schema_version": 1,\n        "research_profile": profile.value,''')
          replace_once('''    recipe_id = os.environ.get("MASTERTRD_RESEARCH_RECIPE_ID", "").strip()\n    plan = research_job_plan_for_recipe(recipe_id) if recipe_id else default_research_job_plan()\n    report = run_research_job(''', '''    recipe_id = os.environ.get("MASTERTRD_RESEARCH_RECIPE_ID", "").strip()\n    raw_profile = os.environ.get("MASTERTRD_RESEARCH_PROFILE", ResearchProfile.SMOKE.value).strip().lower()\n    try:\n        profile = ResearchProfile(raw_profile)\n    except ValueError as exc:\n        raise RuntimeError(f"invalid MASTERTRD_RESEARCH_PROFILE: {raw_profile!r}") from exc\n    plan = research_job_plan_for_recipe(recipe_id) if recipe_id else default_research_job_plan()\n    report = run_research_job(''')
          replace_once('''        code_hash=code_hash,\n        lock_hash=lock_hash,\n    )\n    report_path = artifact_dir / "research-report.json"''', '''        code_hash=code_hash,\n        lock_hash=lock_hash,\n        profile=profile,\n    )\n    report_path = artifact_dir / "research-report.json"''')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/mastertrd/research_job.py
      - name: Commit exact code patch
        shell: bash
        run: |
          if git diff --quiet -- src/mastertrd/research_job.py; then
            echo 'Expected production research code patch produced no diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mastertrd/research_job.py
          git commit -m 'feat: separate production research policy from smoke'
          git push origin HEAD:fix/production-research-policy-20260904
