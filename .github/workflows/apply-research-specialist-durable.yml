name: Apply ResearchBrain durable specialist routing

on:
  push:
    branches:
      - v2/plan-closure-20260831
    paths:
      - .github/workflows/apply-research-specialist-durable.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded durable routing
        run: |
          git pull --ff-only origin v2/plan-closure-20260831
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mastertrd/research_brain.py')
          text = path.read_text()

          parameter = '    specialist_inputs_by_genome_hash: Mapping[str, SpecialistInputs] | None = None,\n'
          if parameter not in text:
              marker = '    lock_hash: str,\n) -> ResearchBrainReport:\n'
              if text.count(marker) != 1:
                  raise SystemExit('run_research_brain signature marker is ambiguous; refusing write')
              text = text.replace(marker, '    lock_hash: str,\n' + parameter + ') -> ResearchBrainReport:\n', 1)

          normalization = '    specialist_inputs_by_genome_hash = dict(specialist_inputs_by_genome_hash or {})\n'
          if normalization not in text:
              guard = '    if not code_hash or not lock_hash:\n        raise ValueError("code_hash and lock_hash are required")\n'
              if text.count(guard) != 1:
                  raise SystemExit('code/lock guard marker is ambiguous; refusing write')
              text = text.replace(guard, guard + normalization, 1)

          stage_start_marker = '    def specialist_stage() -> Mapping[str, Any]:\n'
          stage_end_marker = '    specialist_artifact, _ = _stage(memory, run_id, "specialist_tests", specialist_stage)\n'
          if 'return run_research_specialist_stage(' not in text:
              if text.count(stage_start_marker) != 1 or text.count(stage_end_marker) != 1:
                  raise SystemExit('specialist stage markers are ambiguous; refusing write')
              start = text.index(stage_start_marker)
              end = text.index(stage_end_marker, start)
              replacement = (
                  '    def specialist_stage() -> Mapping[str, Any]:\n'
                  '        return run_research_specialist_stage(\n'
                  '            validation_artifact["outcomes"],\n'
                  '            specialist_inputs_by_genome_hash=specialist_inputs_by_genome_hash,\n'
                  '        )\n\n'
              )
              text = text[:start] + replacement + text[end:]

          path.write_text(text)
          PY
      - name: Verify focused GREEN
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv sync --locked --all-extras
          uv run pytest -q \
            tests/test_research_brain_specialist_stage.py \
            tests/test_research_brain_specialist_batch.py \
            tests/test_research_brain_specialist_wiring.py
      - name: Commit real code and remove one-shot workflow
        run: |
          rm .github/workflows/apply-research-specialist-durable.yml
          git config user.name 'itxsam57'
          git config user.email '143406136+itxsam57@users.noreply.github.com'
          git add src/mastertrd/research_brain.py .github/workflows/apply-research-specialist-durable.yml
          git commit -m 'feat(research): route durable specialist evidence'
          git push origin HEAD:v2/plan-closure-20260831
