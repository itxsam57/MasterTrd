name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test core
        run: |
          pytest -q tests --ignore=tests/integration \
            --cov=mastertrd \
            --cov-omit='src/mastertrd/research/*,src/mastertrd/nautilus_binance.py' \
            --cov-report=term-missing \
            --cov-fail-under=90
