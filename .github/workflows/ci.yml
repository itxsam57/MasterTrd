name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,storage,research]"
      - name: Test core
        run: |
          # Integration-owned execution/HFT/orchestration modules are exercised by
          # their focused workflows and the full-stack cumulative gate. Keep this
          # job's 90% threshold scoped to modules covered by the unit-test surface.
          coverage run \
            --source=mastertrd \
            --omit='src/mastertrd/research/*,src/mastertrd/nautilus_binance.py,src/mastertrd/nautilus_backtest.py,src/mastertrd/nautilus_strategy.py,src/mastertrd/nautilus_evaluation.py,src/mastertrd/nautilus_paper.py,src/mastertrd/nautilus_data.py,src/mastertrd/memory_duckdb.py,src/mastertrd/research_cycle.py,src/mastertrd/robustness_cycle.py,src/mastertrd/hidden_cycle.py,src/mastertrd/paper_cycle.py,src/mastertrd/paper_events.py,src/mastertrd/execution_runtime.py,src/mastertrd/execution_signals.py,src/mastertrd/hft_engine.py,src/mastertrd/nautilus_bar_strategy.py,src/mastertrd/nautilus_multileg_strategy.py,src/mastertrd/nautilus_options_strategy.py,src/mastertrd/nautilus_risk_hook.py,src/mastertrd/research_brain.py,src/mastertrd/reconciliation.py,src/mastertrd/streaming.py' \
            -m pytest -q tests --ignore=tests/integration
          coverage report --show-missing --fail-under=90
