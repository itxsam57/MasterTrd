name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test core
        run: |
          coverage run \
            --source=mastertrd \
            --omit='src/mastertrd/research/*,src/mastertrd/nautilus_binance.py,src/mastertrd/nautilus_backtest.py,src/mastertrd/nautilus_strategy.py,src/mastertrd/nautilus_evaluation.py,src/mastertrd/nautilus_paper.py,src/mastertrd/nautilus_data.py,src/mastertrd/memory_duckdb.py,src/mastertrd/research_cycle.py,src/mastertrd/robustness_cycle.py,src/mastertrd/hidden_cycle.py,src/mastertrd/paper_cycle.py,src/mastertrd/paper_events.py' \
            -m pytest -q tests --ignore=tests/integration
          coverage report --show-missing --fail-under=90
