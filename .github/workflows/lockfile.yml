name: Dependency Lock Artifact

on:
  workflow_dispatch:
  push:
    paths:
      - pyproject.toml
      - .github/workflows/lockfile.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Resolve lock
        run: uv lock
      - name: Verify lock is internally consistent
        run: uv lock --check
      - name: Commit generated lock when changed
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh uv dependency lock"
          git push origin HEAD:main
      - name: Upload lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: mastertrd-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
