name: One-shot PAPER Deploy Dispatcher

on:
  push:
    branches:
      - ops/deploy-paper-atr-slow-20260903
    paths:
      - .github/workflows/one-shot-paper-deploy.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact pinned Oracle PAPER deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REF: deploy/paper-f4a61d-20260903
          PAPER_CANDIDATE_MANIFEST_JSON: >-
            {"candidate":{"allow_short":true,"data_requirements":["BAR"],"entry":{"lookback":17,"multiplier":1.0987052032566855,"trade_size":"0.01000","type":"volatility_breakout"},"exit":{"stop_atr":3.18,"target_atr":6.59,"type":"atr_bracket"},"family":"volatility","filters":{"garch_filter":true},"instruments":["ETHUSDT.BINANCE"],"risk":{"max_drawdown_stop":0.153,"risk_fraction":0.0069},"strategy_id":"R-DA5D1169AA40","style":"recipe:atr-breakout-slow","timeframe":"4h"},"code_hash":"f4a61d162dddd3c6ec13418b43c4f63d2175cbc9","dataset_hash":"0500bd659c04ac045f494bb5a9968bd0f89691ecd8b6e6a675c3e94d03a3115e","genome_hash":"ac3a5eb469fe44f1d3f6fa0b2aa6f353e9641b5bff7248f8e5e98a9a169e36d2","lock_hash":"ab8f78f5f42cec2fdd92fd0e0c94836ad37204f9e668bb47a7d718b7a4ecc9b7","recipe_id":"atr-breakout-slow","strategy_id":"R-DA5D1169AA40"}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          manifest = json.loads(os.environ["PAPER_CANDIDATE_MANIFEST_JSON"])
          expected = {
              "code_hash": "f4a61d162dddd3c6ec13418b43c4f63d2175cbc9",
              "genome_hash": "ac3a5eb469fe44f1d3f6fa0b2aa6f353e9641b5bff7248f8e5e98a9a169e36d2",
              "strategy_id": "R-DA5D1169AA40",
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"candidate identity mismatch for {key}")
          if manifest.get("recipe_id") != "atr-breakout-slow":
              raise SystemExit("candidate recipe mismatch")

          body = json.dumps(
              {
                  "ref": os.environ["TARGET_REF"],
                  "inputs": {
                      "paper_candidate_manifest_json": json.dumps(
                          manifest,
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                  },
              }
          ).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/oracle-deploy.yml/dispatches",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise SystemExit(f"unexpected workflow-dispatch status: {response.status}")
          print("Dispatched pinned Oracle PAPER deployment for R-DA5D1169AA40")
          PY
