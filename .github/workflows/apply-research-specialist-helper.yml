name: Apply ResearchBrain specialist helper

on:
  push:
    branches:
      - v2/plan-closure-20260831
    paths:
      - .github/workflows/apply-research-specialist-helper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/plan-closure-20260831
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded helper change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mastertrd/research_brain.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .robustness_cycle import run_generated_robustness_cycle\n'
          import_line = 'from .specialist_orchestrator import SpecialistInputs, run_specialist_gate\n'
          if 'def evaluate_research_specialist_candidate(' in text:
              raise SystemExit('helper already exists; refusing duplicate write')
          if import_anchor not in text:
              raise SystemExit('expected robustness import anchor missing')
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          helper_anchor = '\n\ndef _parameter_space(genome: StrategyGenome) -> dict[str, object]:\n'
          if helper_anchor not in text:
              raise SystemExit('expected helper insertion anchor missing')
          helper = '''\n\ndef evaluate_research_specialist_candidate(\n    candidate: StrategyGenome,\n    *,\n    score: float,\n    inputs: SpecialistInputs,\n) -> dict[str, Any]:\n    \"\"\"Run the real specialist gate and persist its candidate-bound evidence payload.\"\"\"\n    result = run_specialist_gate(candidate, inputs)\n    return {\n        \"genome\": _genome_payload(candidate),\n        \"passed\": bool(result.passed),\n        \"score\": float(score),\n        \"reason\": result.reason,\n        \"evidence\": [asdict(record) for record in result.evidence],\n        \"missing_evidence\": sorted(result.missing_evidence),\n        \"failed_evidence\": sorted(result.failed_evidence),\n    }\n'''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused GREEN
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --all-extras
          uv run pytest -q tests/test_research_brain_specialist_stage.py
      - name: Commit real code and remove one-shot workflow
        run: |
          git config user.name "itxsam57"
          git config user.email "143406136+itxsam57@users.noreply.github.com"
          git rm .github/workflows/apply-research-specialist-helper.yml
          git add src/mastertrd/research_brain.py
          git commit -m "feat(research): route specialist candidates through typed gate"
          git push origin HEAD:v2/plan-closure-20260831
