name: One-shot Fix Binance Endpoint

on:
  push:
    branches:
      - fix/binance-forward-bar-feed-20260903
    paths:
      - .github/workflows/one-shot-fix-binance-endpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/binance-forward-bar-feed-20260903
      - name: Patch documented Binance public market-data host
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/mastertrd/binance_stream.py')
          text = path.read_text(encoding='utf-8')
          old = 'wss://data-stream.binance.com/stream?streams='
          new = 'wss://data-stream.binance.vision/stream?streams='
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 Binance stream endpoint occurrences, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/mastertrd/binance_stream.py
      - name: Commit minimal endpoint fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mastertrd/binance_stream.py
          git commit -m 'fix: use documented Binance market data websocket host'
          git push origin HEAD:fix/binance-forward-bar-feed-20260903
