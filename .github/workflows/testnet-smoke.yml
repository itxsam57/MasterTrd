name: Testnet Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_manifest_json:
        description: Public-safe TestnetCandidateManifest JSON for the exact champion checkout
        required: true
        type: string

permissions:
  contents: read

jobs:
  testnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet
    env:
      MASTERTRD_MODE: TESTNET
      MASTERTRD_TESTNET_EVIDENCE_PATH: artifacts/testnet_smoke.json
      MASTERTRD_TESTNET_CANDIDATE_MANIFEST: artifacts/testnet_candidate.json
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
      BINANCE_TESTNET_ACCOUNT_ID: ${{ secrets.BINANCE_TESTNET_ACCOUNT_ID }}
      BINANCE_TESTNET_WITHDRAWAL_CAPABLE: ${{ secrets.BINANCE_TESTNET_WITHDRAWAL_CAPABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject withdrawal-capable credential marker
        shell: bash
        run: |
          if [ -n "${BINANCE_TESTNET_WITHDRAWAL_CAPABLE:-}" ]; then
            echo 'Refusing TESTNET credential marked as withdrawal-capable.' >&2
            exit 1
          fi
      - name: Require TESTNET credentials
        shell: bash
        run: |
          for name in BINANCE_TESTNET_API_KEY BINANCE_TESTNET_API_SECRET BINANCE_TESTNET_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required TESTNET credential: ${name}" >&2
              exit 1
            fi
          done
      - name: Install locked stack
        run: |
          python -m pip install --disable-pip-version-check 'uv==0.12.7'
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Materialize and validate champion candidate manifest
        env:
          MASTERTRD_TESTNET_CANDIDATE_JSON: ${{ inputs.candidate_manifest_json }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from mastertrd.testnet_candidate import TestnetCandidateManifest

          raw = os.environ.get('MASTERTRD_TESTNET_CANDIDATE_JSON', '').strip()
          if not raw:
              raise SystemExit('candidate_manifest_json is required')
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'invalid candidate_manifest_json: {exc}') from exc
          if not isinstance(payload, dict):
              raise SystemExit('candidate_manifest_json must contain a JSON object')
          manifest = TestnetCandidateManifest.from_public_payload(payload)
          checkout_sha = os.environ['GITHUB_SHA']
          if manifest.code_hash != checkout_sha:
              raise SystemExit('candidate manifest code_hash does not match the dispatched checkout')
          path = Path(os.environ['MASTERTRD_TESTNET_CANDIDATE_MANIFEST'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(manifest.to_public_payload(), sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'candidate manifest validated for {manifest.strategy_id} {manifest.genome_hash}')
          PY
      - name: Prove TESTNET-only runtime and credential preflight
        run: |
          uv run python - <<'PY'
          import os

          from mastertrd.contracts import RuntimeMode
          from mastertrd.credentials import load_binance_credentials
          from mastertrd.live_node import NodeReadiness, preflight_node
          from mastertrd.runtime import RuntimeConfig

          runtime = RuntimeConfig.from_env(dict(os.environ))
          if runtime.mode is not RuntimeMode.TESTNET:
              raise SystemExit('workflow is not in TESTNET mode')
          credentials = load_binance_credentials(RuntimeMode.TESTNET, os.environ)
          if credentials is None:
              raise SystemExit('TESTNET credentials were not loaded')
          readiness = preflight_node(runtime, os.environ)
          if readiness is not NodeReadiness.EXCHANGE_READY:
              raise SystemExit(f'unexpected readiness: {readiness}')
          print('TESTNET credential/runtime preflight: OK')
          PY
      - name: Run fail-closed TESTNET safety suite
        run: |
          uv run pytest -q \
            tests/test_live_evidence.py \
            tests/test_live_readiness.py \
            tests/test_testnet_smoke_runner.py \
            tests/test_workflow_policy.py \
            tests/integration/test_nautilus_binance_adapter.py \
            tests/integration/test_kill_switch_evidence.py \
            tests/integration/test_reconciliation_evidence.py
      - name: Submit bounded Nautilus TESTNET smoke order
        run: uv run python -m mastertrd.testnet_smoke
      - name: Upload exact-SHA TESTNET evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mastertrd-testnet-smoke-${{ github.sha }}
          path: artifacts/testnet_smoke.json
          if-no-files-found: warn
          retention-days: 14
