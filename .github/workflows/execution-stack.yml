name: Execution Stack

on:
  push:
    paths:
      - 'src/mastertrd/execution.py'
      - 'src/mastertrd/nautilus_binance.py'
      - 'src/mastertrd/nautilus_backtest.py'
      - 'src/mastertrd/nautilus_strategy.py'
      - 'src/mastertrd/nautilus_evaluation.py'
      - 'src/mastertrd/nautilus_paper.py'
      - 'src/mastertrd/nautilus_data.py'
      - 'src/mastertrd/paper_evidence.py'
      - 'src/mastertrd/research/generator.py'
      - 'tests/integration/test_nautilus_binance_adapter.py'
      - 'tests/integration/test_nautilus_backtest.py'
      - 'tests/integration/test_nautilus_strategy_compiler.py'
      - 'tests/integration/test_nautilus_strategy_activity.py'
      - 'tests/integration/test_nautilus_evaluation.py'
      - 'tests/integration/test_nautilus_paper_sandbox.py'
      - 'tests/integration/test_nautilus_market_bar_bridge.py'
      - 'tests/integration/test_generated_strategy_execution_contract.py'
      - 'pyproject.toml'
      - '.github/workflows/execution-stack.yml'
  pull_request:
    paths:
      - 'src/mastertrd/execution.py'
      - 'src/mastertrd/nautilus_binance.py'
      - 'src/mastertrd/nautilus_backtest.py'
      - 'src/mastertrd/nautilus_strategy.py'
      - 'src/mastertrd/nautilus_evaluation.py'
      - 'src/mastertrd/nautilus_paper.py'
      - 'src/mastertrd/nautilus_data.py'
      - 'src/mastertrd/paper_evidence.py'
      - 'src/mastertrd/research/generator.py'
      - 'tests/integration/test_nautilus_binance_adapter.py'
      - 'tests/integration/test_nautilus_backtest.py'
      - 'tests/integration/test_nautilus_strategy_compiler.py'
      - 'tests/integration/test_nautilus_strategy_activity.py'
      - 'tests/integration/test_nautilus_evaluation.py'
      - 'tests/integration/test_nautilus_paper_sandbox.py'
      - 'tests/integration/test_nautilus_market_bar_bridge.py'
      - 'tests/integration/test_generated_strategy_execution_contract.py'
      - 'pyproject.toml'
      - '.github/workflows/execution-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nautilus-binance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install execution stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,execution]"
      - name: Test Nautilus execution bridges
        run: pytest -q tests/test_execution_profile.py tests/integration/test_nautilus_binance_adapter.py tests/integration/test_nautilus_backtest.py tests/integration/test_nautilus_strategy_compiler.py tests/integration/test_nautilus_strategy_activity.py tests/integration/test_nautilus_evaluation.py tests/integration/test_nautilus_paper_sandbox.py tests/integration/test_nautilus_market_bar_bridge.py tests/integration/test_generated_strategy_execution_contract.py
