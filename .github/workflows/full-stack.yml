name: Full Stack Compatibility

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/full-stack.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/full-stack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Install all admitted subsystems from lock
        run: |
          uv lock --check
          uv sync --locked --all-extras
          uv pip check
      - name: Smoke import every external engine
        run: |
          uv run python - <<'PY'
          import arch
          import ccxt
          import duckdb
          import hftbacktest
          import nautilus_trader
          import optuna
          import pymoo
          import quantstats
          import river
          import ruptures
          import skfolio
          import statsmodels
          import talib
          import vectorbt
          print('locked full-stack imports: OK')
          PY
      - name: Run cumulative tests
        run: |
          set +e
          uv run pytest -x -q > /tmp/pytest.log 2>&1
          status=$?
          tail -n 100 /tmp/pytest.log
          exit $status
